kind = "web"
previewPath = "/"
title = "منصة لنتعلم"
description = "منصة تعليمية عربية متجاوبة للطلاب، تجمع المراحل الدراسية والمحتوى المقفول بالاشتراك والاختبارات ولوحة إدارة للمشرف."
version = "1.0.0"
id = "artifacts/learn-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19104

[services.development]
run = "pnpm --filter @workspace/learn-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learn-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/learn-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19104"
BASE_PATH = "/"
